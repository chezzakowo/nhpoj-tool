<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <title>NHP::OJ Tools Beta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css"/>
</head>
<body>

<!-- HEADER -->
<header class="bar">
  <div class="brand">
      <img src="logo.png" alt="Logo" class="brand-logo">
      <span class="brand-txt">NHP::OJ Tools</span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="main">Trang chính</button>
    <button class="tab" data-tab="logs">Nhật kí</button>
  </nav>
  <button class="icon-btn" id="btn-theme">☀️</button>
</header>

<!-- HOME TAB -->
<div id="tab-main" class="pane active">

  <!-- User Card (shown when logged in) -->
  <div id="user-card" class="user-card" style="display:none">
    <div class="user-top">
      <div class="av-wrap">
        <img id="av-img" src="" alt=""/>
        <div id="av-fb" class="av-fb" style="display:none">?</div>
        <button class="av-refresh" id="btn-av-refresh" title="Refresh avatar">🖼</button>
      </div>
      <div class="user-names">
        <!-- PRIMARY: [Rank] username -->
        <div class="rank-line" id="user-rank-line">
          <span id="user-rank-badge" class="rank-badge"></span>
          <span id="user-username-display" class="username-display"></span>
        </div>
        <!-- SECONDARY: Real name -->
        <div id="user-realname" class="realname-sub"></div>
        <!-- TERTIARY: Join date -->
        <div id="user-join-date" class="join-date-sub" style="display:none"></div>
      </div>
    </div>

    <!-- Status row -->
    <div id="status-row" class="status-row">
      <div id="status-badge" class="badge badge-idle">—</div>
      <div id="chain-info" class="chain-info" style="display:none">
        <span id="chain-days" class="chain-days">0</span>
        <span class="chain-label"> ngày chuỗi</span>
      </div>
    </div>

    <!-- Last sign-in -->
    <div id="last-signin-row" class="last-row" style="display:none">
      <span class="last-label">Lần cuối kiểm tra:</span>
      <span id="last-signin-val" class="last-val">—</span>
    </div>

    <!-- Action buttons -->
    <div class="action-row">
      <button class="btn-check" id="btn-check">
        <span class="btn-icon">⟳</span> Kiểm tra chuỗi
      </button>
      <button class="btn-signin" id="btn-signin">
        <span class="btn-icon">✓</span> Điểm danh ngay
      </button>
    </div>

    <!-- Auto sign-in row -->
    <div class="settings-row">
      <span class="settings-label">⏰ Tự điểm danh lúc</span>
      <input type="time" id="signin-time" class="time-inp" value="00:01"/>
      <label class="toggle">
        <input type="checkbox" id="auto-toggle"/>
        <span class="track"><span class="thumb"></span></span>
      </label>
    </div>

    <!-- Inline feedback -->
    <div id="card-msg" class="card-msg"></div>
  </div>

  <!-- Not logged in -->
  <div id="no-session" class="no-session" style="display:none">
    <div class="no-icon">🔒</div>
    <div class="no-title">Chưa đăng nhập</div>
    <div id="no-desc" class="no-desc">Mở <b>nhpoj.net</b> và đăng nhập để bắt đầu.</div>
    <button class="retry-btn" id="btn-retry">↺ Thử lại</button>
  </div>

  <!-- Loading -->
  <div id="loading-state" class="loading-state">
    <div class="spinner"></div>
    <div class="loading-txt">Đang phát hiện phiên đăng nhập…</div>
  </div>

</div>

<!-- LOGS TAB -->
<div id="tab-logs" class="pane">
  <div class="log-bar">
    <button class="ltab active" data-ltab="signin">Sign-in</button>
    <button class="ltab" data-ltab="debug">Debug</button>
    <button class="ghost-btn" id="btn-clear" style="margin-left:auto">🗑 Xóa</button>
  </div>
  <div id="ltab-signin" class="lpane active">
    <div id="log-signin" class="log-scroll"><div class="empty">Chưa có log.</div></div>
  </div>
  <div id="ltab-debug" class="lpane">
    <div class="dbg-bar">
      <button class="ghost-btn" id="btn-dbg-refresh">↺ Refresh</button>
    </div>
    <div id="log-debug" class="log-scroll dbg-scroll"><div class="empty">Chưa có debug log.</div></div>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
